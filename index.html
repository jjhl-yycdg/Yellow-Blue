<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Yellow & Blue</title>
  <!-- Favicon for browser tab -->
  <link rel="icon" type="image/png" href="icon.png?v=20251030">
  <link rel="shortcut icon" type="image/png" href="icon.png?v=20251030">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <div class="header-left">
      <h1><span class="brand-yellow">Yellow</span>&nbsp;&amp;&nbsp;<span class="brand-blue">Blue</span></h1>
    </div>
    <div class="header-actions">
      <div class="search" id="artist-search-wrap">
        <input id="artist-search" class="search-input" type="search" placeholder="搜索画师…" aria-label="搜索画师" autocomplete="off" />
        <div id="search-results" class="search-results hidden" role="listbox" aria-label="搜索结果"></div>
      </div>
      <button id="lang-toggle" class="btn ghost icon" title="切换语言" aria-label="切换语言">
        <svg class="icon-lang" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="9"></circle>
          <path d="M3 12h18M12 3a15 15 0 0 1 0 18M12 3a15 15 0 0 0 0 18"></path>
        </svg>
      </button>
      <button id="theme-toggle" class="btn ghost icon" aria-pressed="false" title="切换暗/亮主题" aria-label="切换暗/亮主题">
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="4"></circle>
          <path d="M12 2v2m0 16v2M22 12h-2M4 12H2m15.5 6.5-1.4-1.4M7.9 7.9 6.5 6.5m10 0 1.4-1.4M7.9 16.1 6.5 17.5"></path>
        </svg>
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
        </svg>
      </button>
    </div>
  </header>

  <main>
    <section id="upload-section">
      <div id="drop-area" class="drop-area">
        <form id="upload-form">
          <p id="upload-tip">把图片拖到这里上传，或点击选择文件</p>
          <input id="fileElem" type="file" accept="image/*" multiple />
          <label class="btn ghost icon" for="fileElem" title="选择文件" aria-label="选择文件">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
              <polyline points="17 8 12 3 7 8"/>
              <line x1="12" y1="3" x2="12" y2="15"/>
            </svg>
          </label>
        </form>
      </div>

  <h2 id="intro-title">介绍</h2>
      <div id="home-intro" class="home-intro">
        <p>在这里用文字介绍你的 OC。需要修改内容时，请直接编辑 index.html 中这一段文字。</p>
      </div>

      <div id="albums-list" class="albums-list">
        <h2 id="albums-title">相册</h2>
        <div id="albums" class="albums"></div>
      </div>
    </section>

    <section id="view-section">
      <div id="main-view"></div>
    </section>
  </main>

  <!-- 模态 -->
  <div id="modal" class="modal hidden" aria-hidden="true">
    <div class="modal-content">
      <button id="modal-close" class="modal-close">✕</button>
      <div id="modal-body"></div>
    </div>
  </div>

  <script src="js/db.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
